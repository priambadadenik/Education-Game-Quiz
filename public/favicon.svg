<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="eduGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1E1B4B" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Base with rounded corners -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#eduGrad)" filter="url(#shadow)" />

  <!-- Inner border highlight -->
  <rect x="5.5" y="5.5" width="53" height="53" rx="12.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5" />

  <!-- Academic Mortarboard / Graduation Cap -->
  <!-- Cap Top Diamond -->
  <polygon points="32,16 51,25 32,34 13,25" fill="#FFFFFF" />
  
  <!-- Under Cap / Skull Cap -->
  <path d="M19 28.5 V35.5 C19 35.5 24 41 32 41 C40 41 45 35.5 45 35.5 V28.5 L32 34.5 Z" fill="#E0E7FF" />

  <!-- Tassel Ribbon & Ball -->
  <path d="M46 27.5 L48 37 C48 37 47 40 45 41" fill="none" stroke="url(#starGrad)" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="45" cy="42" r="2" fill="url(#starGrad)" />

  <!-- Central Button on Cap -->
  <ellipse cx="32" cy="25" rx="2.5" ry="1.8" fill="#4338CA" />

  <!-- Sparkle Star Accent at bottom-left -->
  <path d="M22 47 L23.5 43.5 L27 42 L23.5 40.5 L22 37 L20.5 40.5 L17 42 L20.5 43.5 Z" fill="url(#starGrad)" />
</svg>
